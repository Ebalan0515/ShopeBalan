<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — ShopEbalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="brand-panel">
    <div class="brand-mark"><span class="dot"></span> ShopEbalan</div>

    <div class="brand-hero">
      <h1>Start your <span class="accent-word">shop</span> here.</h1>
      <p>One account is all you need — open your shop from any device, desktop or mobile.</p>
    </div>

    <div class="brand-footer">
      <span><strong>Secure</strong> — protected by Firebase Auth</span>
      <span><strong>Verified</strong> — requires a verified email</span>
    </div>
  </section>

  <section class="form-panel">
    <div class="card">
      <h2>Create your account</h2>
      <p class="subtitle">It's free and takes just seconds to set up.</p>

      <div class="message error" id="errorMsg"></div>
      <div class="message success" id="successMsg"></div>

      <form id="registerForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Juan Dela Cruz" required />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@email.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>
      </form>

      <div class="divider">or</div>

      <button type="button" class="btn btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/></svg>
        Sign up with Google
      </button>

      <p class="switch-line">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </section>

  <script type="module" src="register.js"></script>
</body>
</html>
