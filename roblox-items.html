<!DOCTYPE html>

<body class="subpage-body">

  <div class="subpage-topbar">
    <a href="dashboard.html" class="back-link">← Back to offers</a>
    <div class="brand-mark"><span class="dot"></span> ShopEbalan</div>
  </div>

  <main class="subpage-main">
    <div class="browse-header">
      <h1>Roblox Items</h1>
      <p>Browse items, currency, and boosts listed by real sellers. Prices and details are set by whoever's selling — reach out through Buy now once checkout is connected.</p>

      <div class="trust-row">
        <span class="trust-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l7 3v6c0 4.4-3 8.4-7 9-4-.6-7-4.6-7-9V6l7-3Z"/></svg> SSL secure</span>

        <span class="trust-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16v10H4zM4 7l8 5 8-5"/></svg> Cashback 5%</span>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Search items..." />
    </div>

    <div id="listingsResults" class="listing-buy-grid"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module" src="roblox-items.js"></script>
